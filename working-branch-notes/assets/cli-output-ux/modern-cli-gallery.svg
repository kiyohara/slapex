  <!-- yarn -->
  <text x="24" y="366" fill="#58a6ff" font-weight="bold">── yarn 4 (berry) ──</text>
  <text x="24" y="390" fill="#d6dbe3"><tspan fill="#58a6ff">➤</tspan> YN0000: · <tspan font-weight="bold" fill="#f0f6fc">Yarn 4.17.0</tspan></text>
  <text x="24" y="411" fill="#d6dbe3"><tspan fill="#58a6ff">➤</tspan> <tspan fill="#8b949e">YN0000</tspan>: ┌ Resolution step</text>
  <text x="24" y="432" fill="#d6dbe3"><tspan fill="#58a6ff">➤</tspan> <tspan fill="#8b949e">YN0085</tspan>: │ <tspan fill="#3fb950">+</tspan> <tspan fill="#ff7b72">express</tspan><tspan fill="#56d4dd">@npm:5.2.1</tspan>, <tspan fill="#ff7b72">accepts</tspan><tspan fill="#56d4dd">@npm:2.0.0</tspan>, and <tspan fill="#e3b341">63</tspan> more.</text>
  <text x="24" y="453" fill="#d6dbe3"><tspan fill="#58a6ff">➤</tspan> <tspan fill="#8b949e">YN0000</tspan>: └ Completed in 0s 309ms</text>
