  <text x="24" y="753" fill="#8b949e">Installed <tspan font-weight="bold" fill="#d6dbe3">4 packages</tspan> in 7ms</text>
  <text x="24" y="774" fill="#d6dbe3"> <tspan fill="#3fb950">+</tspan> <tspan font-weight="bold" fill="#f0f6fc">rich</tspan><tspan fill="#8b949e">==15.0.0</tspan></text>
  <text x="24" y="795" fill="#d6dbe3"> <tspan fill="#3fb950">+</tspan> <tspan font-weight="bold" fill="#f0f6fc">pygments</tspan><tspan fill="#8b949e">==2.20.0</tspan></text>

  <text x="24" y="840" fill="#6e7681" font-size="12">共通: 基本 8/16 色 + bold/dim だけで意味付け(green=成功 / red=失敗 / yellow=警告 / cyan=数値・情報 / dim=補足)。</text>
  <text x="24" y="860" fill="#6e7681" font-size="12">live 更新(spinner・進捗)は一時表示に限定し、確定情報は通常の行として積む。non-TTY では全ツール plain に劣化。</text>
</svg>
