version: 2

project_name: slapex

env:
  - GOTOOLCHAIN=auto

builds:
  - id: slapex-darwin
    main: ./cmd/slapex
    binary: slapex
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: slapex-linux
    main: ./cmd/slapex
    binary: slapex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: slapex-darwin
    ids:
      - slapex-darwin
    formats:
      - binary
    name_template: "slapex_{{ .Os }}_{{ .Arch }}"
  - id: slapex-linux
    ids:
      - slapex-linux
    formats:
      - binary
    name_template: "slapex_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "slapex_checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: slapex
    ids:
      - slapex-darwin
    binaries:
      - slapex
    repository:
      owner: kiyohara
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/kiyohara/slapex"
    description: "Export Slack channel posts and assets as local static HTML"
    skip_upload: auto
    hooks:
      post:
        install: |
          if OS.mac?
            Dir["#{staged_path}/slapex_darwin_*"].each do |binary|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", binary]
            end
          end

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
